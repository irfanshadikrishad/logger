name: npmjs
on:
  release:
    types: [published]
concurrency:
  group: npmjs-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - name: Verify repository.url matches this repository
        run: |
          REPO_URL="$(npm pkg get repository.url | tr -d '"')"
          NORMALIZED="${REPO_URL#git+}"
          NORMALIZED="${NORMALIZED%.git}"
          EXPECTED="https://github.com/${GITHUB_REPOSITORY}"
          if [ "${NORMALIZED,,}" != "${EXPECTED,,}" ]; then
            echo "::error::package.json repository.url is '${REPO_URL}', expected '${EXPECTED}'"
            exit 1
          fi
      - name: Configure Git
        run: |
          git config --global user.name "Irfan Shadik Rishad"
          git config --global user.email "77362427+irfanshadikrishad@users.noreply.github.com"
      - name: Bump Version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == *"-major" ]]; then
            npm version major --no-git-tag-version
          elif [[ "$TAG" == *"-minor" ]]; then
            npm version minor --no-git-tag-version
          else
            npm version patch --no-git-tag-version
          fi
      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash
      - name: Install Dependencies
        run: npm ci
      - name: Publish Package (skipped if this version is already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published, skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: Commit the Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |-
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Version files already up to date, nothing to commit."
            exit 0
          fi
          git commit -m "npmjs: released v${VERSION}"

          # GitHub occasionally returns transient 5xx errors on push. Retry with backoff.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt ${attempt} failed, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the version commit. v${VERSION} IS published to npm; commit package.json manually."
          exit 1
